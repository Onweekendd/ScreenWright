name: Release Desktop

# 推 v* tag 自动打 Windows 安装包并挂到 GitHub Release；也可手动触发试跑（不发 release）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # prisma.config.ts 的 env("PRISMA_DATABASE_URL") 缺失即抛错，postinstall 的 prisma generate 需要；
  # 打包时 build-sidecar 会另指到临时目录建干净库，这里只是占位
  PRISMA_DATABASE_URL: file:./.data/screenwright.db

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install
        run: pnpm install --frozen-lockfile

      # build-sidecar：bundle 后端 + 扁平 node_modules + 从零建干净的预 seed 库；
      # desktop:build：vite 桌面模式构建前端 + cargo release + NSIS
      - name: Build sidecar & installer
        run: pnpm desktop:package
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screenwright-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
