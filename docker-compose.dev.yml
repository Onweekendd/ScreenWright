# 本地开发依赖：PostgreSQL + pgvector。完整部署编排见后续阶段（P2）。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: funbi-dev-pg
    environment:
      POSTGRES_USER: funbi
      POSTGRES_PASSWORD: funbi_dev
      POSTGRES_DB: funbi
    ports:
      - "5432:5432"
    volumes:
      - funbi_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funbi -d funbi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: funbi-dev-redis
    # 宿主机 6380：6379 常被本机其他项目占用
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - funbi_dev_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  funbi_dev_pgdata:
  funbi_dev_redisdata:
