# 回源 TLS：只给香港边缘节点（docker/edge）用，让香港到源站这一段在公网上是加密的。
# 证书是自签的，香港那边固定（pin）这张证书来校验，不依赖域名，也不需要备案。
# 只有挂载了 /etc/nginx/certs/origin.{crt,key} 才会启用，见 web-enable-tls.sh。

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/site.inc;
}
