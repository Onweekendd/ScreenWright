# 网关：托管编辑器静态文件，并按路径把请求分流给 api / ai / MinIO。
# 浏览器只认这一个域名；前端构建时后端地址配成空串（同源）。

# WebSocket 升级：有 Upgrade 头就保持连接，否则按普通请求
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# 经香港边缘节点（docker/edge）转发时，保留它传来的协议；直连时用本机 scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

upstream api_backend {
    server api:4111;
}

# ai 是单副本（对话状态在进程内存里），不要在这里加多个 server
upstream ai_backend {
    server ai:4112;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/site.inc;
}
